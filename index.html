<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:,">
    <title>ГОСКОМБЛАГ СССР — Терминал БЭСМ-6</title>
    <style>
        body {
            background-color: #000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            margin: 0;
            padding: 20px;
            overflow-y: auto;
            text-shadow: 0 0 4px rgba(0,255,0,0.6);
        }
        #console {
            white-space: pre-wrap;
            word-wrap: break-word;
            line-height: 1.3;
        }
        /* Кастомные стили для эмуляции кодов ANSI */
        .ansi-bold { font-weight: bold; color: #55ff55; }
        .ansi-blink { animation: crt-blink 1s steps(2, start) infinite; }
        @keyframes crt-blink { to { opacity: 0; } }
        
        #hidden-input {
            position: absolute; left: -9999px; opacity: 0;
        }

        a:link {
            color: #90EE90;          /* Светло-зеленый цвет */
            text-decoration: none;   /* Убирает подчеркивание */
        }
        a:visited {
            color: #006400;          /* Темно-зеленый цвет */
            text-decoration: none;   /* Убирает подчеркивание */
        }
        a:hover {
            color: #32CD32;          /* Чуть ярче при наведении */
            text-decoration: none;   /* Линия не появится и при наведении */
        }
    </style>
</head>
<body>
    <input type="text" id="hidden-input" autofocus autocomplete="off">
    <div id="console">Установка соединения с БЭСМ-6...</div>

<script>
    const consoleDiv = document.getElementById('console');
    const hiddenInput = document.getElementById('hidden-input');
    
    // Если сайта пока нет на HTTPS, используем ws://. Если SSL уже настроен — укажите 'wss://'
    const ws = new WebSocket('wss://DOMAIN_PLACEHOLDER/ws');

    let currentBuffer = "";

    ws.onopen = () => {
        consoleDiv.innerHTML = "";
    };

    ws.onmessage = (event) => {
        renderData(event.data);
    };

    ws.onclose = () => {
        renderData("\n\n[СЕАНС СВЯЗИ ЗАВЕРШЕН]");
    };

    // Фокус на скрытый инпут для вызова клавиатур на смартфонах
    document.addEventListener('click', () => hiddenInput.focus());

    // Перехват ввода и отправка посимвольно (имитация tty.setraw)
    document.addEventListener('keydown', (e) => {
        if (ws.readyState !== WebSocket.OPEN) return;
        
        if (e.key === 'Enter') {
            ws.send("\r");
        } else if (e.key.length === 1) {
            ws.send(e.key);
        }
        // Запрещаем стандартные действия браузера (например, поиск по клавишам)
        if(e.key === '/' || e.key === "'") e.preventDefault();
    });

    // Обработка ввода для мобильных устройств
    hiddenInput.addEventListener('input', (e) => {
        if (ws.readyState === WebSocket.OPEN && e.target.value.length > 0) {
            ws.send(e.target.value.slice(-1));
            e.target.value = "";
        }
    });

    function renderData(data) {
        // Если пришла команда очистки от сервера — мгновенно обнуляем экран и буфер
        if (data === "[CMD_CLEAR]") {
            consoleDiv.innerHTML = "";
            currentBuffer = "";
            return;
        }

        currentBuffer += data;

        // Превращаем ANSI-цвета в безопасный HTML
        let formatted = currentBuffer
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/\r\n/g, "<br>")
            .replace(/\n/g, "<br>")
            .replace(/\r/g, "")
            // Жирный зеленый текст (BOLD_GREEN: \033[1;32m)
            .replace(/\x1b\[1;32m([\s\S]*?)(?:\x1b\[0m|$)/g, '<span class="ansi-bold">$1</span>')
            // Мигающий зеленый текст (BLINK_GREEN: \033[5;32m)
            .replace(/\x1b\[5;32m([\s\S]*?)(?:\x1b\[0m|$)/g, '<span class="ansi-bold ansi-blink">$1</span>')
            // Стандартный зеленый текст (GREEN: \033[0;32m)
            .replace(/\x1b\[0;32m([\s\S]*?)(?:\x1b\[0m|$)/g, '<span>$1</span>')
            // Убираем сбросы стилей
            .replace(/\x1b\[0m/g, "");

        consoleDiv.innerHTML = formatted;
        window.scrollTo(0, document.body.scrollHeight);
    }
</script>
</body>
</html>
