<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:,">
    <title>ГОСКОМБЛАГ СССР — Терминал БЭСМ-6</title>
    <style>
        body {
            background-color: #000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            margin: 0;
            padding: 20px;
            overflow-y: auto;
        }
        #console {
            white-space: pre-wrap;
            word-wrap: break-word;
            line-height: 1.3;
        }
        
        #hidden-input {
            position: absolute; left: -9999px; opacity: 0;
        }

        a:link {
            color: #90EE90;          /* Светло-зеленый цвет */
            text-decoration: none;   /* Убирает подчеркивание */
        }
        a:visited {
            color: #006400;          /* Темно-зеленый цвет */
            text-decoration: none;   /* Убирает подчеркивание */
        }
        a:hover {
            color: #00ff00;          /* Чуть ярче при наведении */
            text-decoration: none;   /* Линия не появится и при наведении */
        }
    </style>
</head>
<body>
    <input type="text" id="hidden-input" autofocus autocomplete="off">
    <div id="console">Установка соединения с БЭСМ-6...</div>

<script>
    const consoleDiv = document.getElementById('console');
    const hiddenInput = document.getElementById('hidden-input');
    
    const ws = new WebSocket('wss://DOMAIN_PLACEHOLDER/ws');

    let currentBuffer = "";

    ws.onopen = () => {
        consoleDiv.innerHTML = "";
    };

    ws.onmessage = (event) => {
        renderData(event.data);
    };

    ws.onclose = () => {
        renderData("\n\n[СЕАНС СВЯЗИ ЗАВЕРШЕН]");
    };

    // Фокус на скрытый инпут для вызова клавиатур на смартфонах и удержания фокуса ввода
    document.addEventListener('click', () => hiddenInput.focus());

    // Перехват системных и специальных клавиш (ПК)
    document.addEventListener('keydown', (e) => {
        if (ws.readyState !== WebSocket.OPEN) return;
        
        // Защита от автоповтора при зажатии клавиши
        if (e.repeat) return; 

        // Обрабатываем ТОЛЬКО спец-клавиши. 
        // Буквы и цифры не трогаем, они упадут в hiddenInput и обработаются ниже!
        if (e.key === 'Enter') {
            ws.send("\r");
            e.preventDefault();
        } else if (e.key === 'Backspace') {
            ws.send("\x7f"); // Стандартный ASCII-код Backspace (DEL) для TTY
            e.preventDefault();
        }
        
        // Запрещаем стандартные действия браузера (например, поиск по клавишам)
        if (e.key === '/' || e.key === "'") e.preventDefault();
    });

    // ЕДИНЫЙ обработчик для ВСЕГО текстового ввода (и для ПК, и для смартфонов)
    hiddenInput.addEventListener('input', (e) => {
        if (ws.readyState !== WebSocket.OPEN) {
            e.target.value = "";
            return;
        }

        const text = e.target.value;
        if (text.length > 0) {
            // Отправляем самый свежий введенный символ
            ws.send(text.slice(-1));
            // Мгновенно очищаем поле, чтобы оно всегда было готово к приему следующего символа
            e.target.value = ""; 
        }
    });


    function renderData(data) {
        // Если пришла команда очистки от сервера — мгновенно обнуляем экран и буфер
        if (data === "[CMD_CLEAR]") {
            consoleDiv.innerHTML = "";
            currentBuffer = "";
            return;
        }

        currentBuffer += data;

        // Превращаем ANSI-цвета в безопасный HTML
        let formatted = currentBuffer
            .replace(/&/g, "&amp;")
            //.replace(/</g, "&lt;") // Закоментить, если надо парсить HTML
            //.replace(/>/g, "&gt;") // Закоментить, если надо парсить HTML  
            .replace(/\r\n/g, "<br>")
            .replace(/\n/g, "<br>")
            .replace(/\r/g, "");

        consoleDiv.innerHTML = formatted;
        window.scrollTo(0, document.body.scrollHeight);
    }
</script>
</body>
</html>
